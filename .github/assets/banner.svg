<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="MedLink DZ — Partage solidaire de médicaments en Algérie">
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="70%">
      <stop offset="0" stop-color="#13805C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#13805C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="8%" cy="110%" r="55%">
      <stop offset="0" stop-color="#86D6B3" stop-opacity=".18"/>
      <stop offset="1" stop-color="#86D6B3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="#0A1612"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>
    <rect width="1280" height="420" fill="url(#glow2)"/>

    <!-- Logo -->
    <g transform="translate(88 92)">
      <rect width="64" height="64" rx="18" fill="#13805C"/>
      <rect x="26" y="13" width="12" height="38" rx="6" fill="#fff"/>
      <rect x="13" y="26" width="38" height="12" rx="6" fill="#86D6B3"/>
      <rect x="26" y="26" width="12" height="12" fill="#fff"/>
      <text x="84" y="43" font-family="'Space Grotesk','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">MedLink<tspan dx="8" font-family="'JetBrains Mono',Consolas,monospace" font-size="16" font-weight="500" fill="#86D6B3" letter-spacing="2">DZ</tspan></text>
    </g>

    <!-- Headline -->
    <text x="88" y="250" font-family="'Space Grotesk','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="58" font-weight="600" fill="#fff" letter-spacing="-1.2">Un médicament inutilisé ici,</text>
    <text x="88" y="318" font-family="'Space Grotesk','Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="58" font-weight="600" fill="#86D6B3" letter-spacing="-1.2">un traitement ailleurs.</text>
    <text x="90" y="366" font-family="'JetBrains Mono',Consolas,monospace" font-size="15" fill="#FFFFFF" fill-opacity=".55" letter-spacing="2.4">PARTAGE SOLIDAIRE · 69 WILAYAS · MODÉRÉ PAR L'ÉQUIPE</text>

    <!-- Offer / request cards -->
    <g transform="translate(900 120)" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif">
      <g transform="rotate(-4)">
        <rect width="290" height="104" rx="20" fill="#fff"/>
        <rect x="20" y="20" width="64" height="64" rx="14" fill="#E2F1E9"/>
        <path d="M52 64s-15-8.5-15-19a8 8 0 0 1 15-4 8 8 0 0 1 15 4c0 10.5-15 19-15 19z" stroke="#13805C" stroke-width="4" stroke-linejoin="round" fill="none"/>
        <rect x="102" y="22" width="62" height="22" rx="11" fill="#E2F1E9"/>
        <text x="133" y="37.5" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#13805C" letter-spacing="1.5">OFFRE</text>
        <text x="102" y="68" font-size="19" font-weight="700" fill="#0A1612">Doliprane 1000 mg</text>
        <text x="102" y="88" font-family="'JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#5F6E68">16 · ALGER · EXP. 06/2027</text>
      </g>
      <g transform="translate(40 136) rotate(3)">
        <rect width="290" height="104" rx="20" fill="#fff"/>
        <rect x="20" y="20" width="64" height="64" rx="14" fill="#FBE7E1"/>
        <circle cx="49" cy="49" r="11" stroke="#D4512F" stroke-width="4" fill="none"/>
        <path d="M57 57l8 8" stroke="#D4512F" stroke-width="4" stroke-linecap="round"/>
        <rect x="102" y="22" width="86" height="22" rx="11" fill="#FBE7E1"/>
        <text x="145" y="37.5" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#D4512F" letter-spacing="1.5">DEMANDE</text>
        <text x="102" y="68" font-size="19" font-weight="700" fill="#0A1612">Humalog KwikPen</text>
        <text x="102" y="88" font-family="'JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#5F6E68">31 · ORAN · ORDONNANCE ✓</text>
      </g>
    </g>
  </g>
</svg>
