<!doctype html>
<html lang="fr">
<head>
  <!-- @include head -->
  <title>Connexion — MedLink DZ</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <main id="main" class="grid min-h-[100svh] lg:grid-cols-2">
    <section class="flex min-h-[100svh] flex-col px-6 py-6 sm:px-10">
      <div class="mx-auto my-auto w-full max-w-[400px] py-4 animate-rise">
        <!-- @include auth-logo -->
        <h1 class="text-[1.75rem] font-semibold leading-tight tracking-tight sm:text-3xl" data-title>Bon retour sur MedLink</h1>
        <p class="mt-1.5 text-lg leading-snug text-muted" data-subtitle>Connectez-vous pour continuer.</p>
        <form class="mt-8 space-y-5" data-form>
          <div class="field">
            <label for="email" class="field-label">Email</label>
            <div class="field-control"><i data-lucide="mail"></i><input id="email" name="email" type="email" autocomplete="email" placeholder="vous@exemple.com" required></div>
          </div>
          <div class="field">
            <div class="flex items-center justify-between"><label for="password" class="field-label">Mot de passe</label><a href="/forgot-password" class="text-[13px] font-medium text-brand hover:underline">Mot de passe oublié&nbsp;?</a></div>
            <div class="field-control"><i data-lucide="lock"></i><input id="password" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
              <button type="button" class="rounded-full p-1 text-muted hover:text-text" aria-label="Afficher le mot de passe" data-toggle-pw="password"><i data-lucide="eye" class="size-4"></i></button></div>
          </div>
          <div class="space-y-3" data-feedback aria-live="polite"></div>
          <button class="btn btn-primary btn-lg w-full" data-submit>Se connecter</button>
        </form>
        <p class="mt-6 border-t border-line pt-5 text-sm text-body">Nouveau sur MedLink DZ&nbsp;? <a href="/register" class="font-medium text-brand hover:underline">Créer un compte</a></p>
      </div>
      <p class="mx-auto w-full max-w-[400px] text-center text-xs text-muted">© MedLink DZ · <a href="/conditions" class="hover:text-text">Conditions</a> · <a href="/confidentialite" class="hover:text-text">Confidentialité</a></p>
    </section>
    <!-- @include auth-aside -->
  </main>

  <script type="module" src="/src/js/pages/login.js"></script>
</body>
</html>
