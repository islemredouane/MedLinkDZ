<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1612">
<meta name="robots" content="noindex">
<title>Hors connexion — MedLink DZ</title>
<!-- Shown by the service worker when a page is not available offline. Self-contained: no external file, so it always renders. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { display: grid; place-items: center; padding: 24px; background: #0A1612; color: #fff; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(700px 420px at 85% -10%, rgba(19,128,92,.45), transparent 62%), radial-gradient(500px 360px at -5% 110%, rgba(134,214,179,.12), transparent 60%); }
  main { width: 100%; max-width: 420px; text-align: center; }
  .logo { display: block; width: 72px; height: 72px; margin: 0 auto 28px; border-radius: 22px; box-shadow: 0 18px 40px -14px rgba(19,128,92,.7); }
  .tag { display: inline-block; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05); font: 600 11px ui-monospace, 'JetBrains Mono', Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; color: #86D6B3; }
  h1 { margin-top: 20px; font-size: 30px; line-height: 1.12; letter-spacing: -.02em; font-weight: 600; }
  p { margin-top: 14px; font-size: 16px; line-height: 1.55; color: rgba(255,255,255,.66); }
  button { margin-top: 30px; height: 52px; padding: 0 28px; border: 0; border-radius: 999px; background: #13805C; color: #fff; font: 600 16px inherit; font-family: inherit; cursor: pointer; transition: transform .15s, background .2s; }
  button:hover { background: #17936A; } button:active { transform: scale(.97); }
  small { display: block; margin-top: 18px; font-size: 13px; color: rgba(255,255,255,.4); }
</style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#13805C"/><rect x="13" y="6.5" width="6" height="19" rx="3" fill="#fff"/><rect x="6.5" y="13" width="19" height="6" rx="3" fill="#86D6B3"/><rect x="13" y="13" width="6" height="6" fill="#fff"/></svg>
    <span class="tag">Hors connexion</span>
    <h1>Vous êtes hors ligne</h1>
    <p>Cette page n'est pas disponible sans connexion. Vérifiez votre réseau, puis réessayez : les pages que vous avez déjà ouvertes restent accessibles.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
    <small>MedLink DZ</small>
  </main>
  <script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
