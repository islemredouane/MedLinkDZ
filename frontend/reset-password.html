<!doctype html>
<html lang="fr">
<head>
  <!-- @include head -->
  <title>Nouveau mot de passe — MedLink DZ</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <main id="main" class="grid min-h-[100svh] lg:grid-cols-2">
    <section class="flex min-h-[100svh] flex-col px-6 py-6 sm:px-10">
      <div class="mx-auto my-auto w-full max-w-[400px] py-4 animate-rise">
        <!-- @include auth-logo -->
        <h1 class="text-[1.75rem] font-semibold leading-tight tracking-tight sm:text-3xl" data-title>Nouveau mot de passe</h1>
        <p class="mt-1.5 text-lg leading-snug text-muted" data-subtitle>Au moins 8 caractères.</p>
        <form class="mt-8 space-y-5" data-form>
          <div class="field">
            <label for="token" class="field-label">Jeton de réinitialisation</label>
            <div class="field-control"><i data-lucide="key-round"></i><input id="token" name="token" autocomplete="off" placeholder="Collez le jeton ici" required></div>
          </div>
          <div class="field">
            <div class="flex items-center justify-between"><label for="newPassword" class="field-label">Nouveau mot de passe</label></div>
            <div class="field-control"><i data-lucide="lock"></i><input id="newPassword" type="password" name="newPassword" autocomplete="new-password" placeholder="8 caractères minimum" minlength="8" required>
              <button type="button" class="rounded-full p-1 text-muted hover:text-text" aria-label="Afficher le mot de passe" data-toggle-pw="newPassword"><i data-lucide="eye" class="size-4"></i></button></div>
          </div>
          <div class="space-y-3" data-feedback aria-live="polite"></div>
          <button class="btn btn-primary btn-lg w-full" data-submit>Réinitialiser</button>
        </form>
        <p class="mt-6 border-t border-line pt-5 text-sm text-body">Retour à la <a href="/login" class="font-medium text-brand hover:underline">connexion</a></p>
      </div>
      <p class="mx-auto w-full max-w-[400px] text-center text-xs text-muted">© MedLink DZ · <a href="/conditions" class="hover:text-text">Conditions</a> · <a href="/confidentialite" class="hover:text-text">Confidentialité</a></p>
    </section>
    <!-- @include auth-aside -->
  </main>

  <script type="module" src="/src/js/pages/reset-password.js"></script>
</body>
</html>
