<!doctype html>
<html lang="fr">
<head>
  <!-- @include head -->
  <title>Mon profil — MedLink DZ</title>
  <meta name="robots" content="noindex" />
</head>
<body class="is-gated">
  <!-- @include header -->

  <main id="main" class="pb-28 pt-28 md:pt-36">
    <div class="shell" data-gate-loader><div class="skeleton h-56 rounded-3xl"></div></div>

    <div class="shell" data-gated>
      <!-- Identity -->
      <section class="flex flex-col gap-8 border-b border-line pb-10 md:flex-row md:items-end md:justify-between">
        <div class="flex items-center gap-5">
          <span class="grid size-20 shrink-0 place-items-center overflow-hidden rounded-3xl bg-brand-soft font-display text-2xl font-semibold text-brand md:size-24" data-avatar></span>
          <div>
            <h1 class="text-3xl font-semibold md:text-5xl" data-fullname></h1>
            <div class="mt-3 flex flex-wrap gap-2" data-chips></div>
          </div>
        </div>
        <div class="flex flex-wrap gap-2">
          <a href="/admin" class="btn btn-outline btn-sm" data-admin-link hidden><i data-lucide="shield-check"></i>Console admin</a>
          <a href="/profil/modifier" class="btn btn-dark btn-sm"><i data-lucide="pencil"></i>Modifier le profil</a>
        </div>
      </section>

      <!-- Stats -->
      <section class="grid grid-cols-3 divide-x divide-line border-b border-line">
        <div class="py-8 pr-3"><p class="whitespace-nowrap font-mono text-[10px] uppercase tracking-[0.08em] text-muted sm:text-[11px] sm:tracking-[0.14em]">Annonces</p><p class="mt-2 font-display text-4xl font-semibold text-text" data-stat="total">—</p></div>
        <div class="px-3 py-8 sm:px-8"><p class="whitespace-nowrap font-mono text-[10px] uppercase tracking-[0.08em] text-muted sm:text-[11px] sm:tracking-[0.14em]">Publiées</p><p class="mt-2 font-display text-4xl font-semibold text-brand" data-stat="publiee">—</p></div>
        <div class="py-8 pl-3 sm:pl-8"><p class="whitespace-nowrap font-mono text-[10px] uppercase tracking-[0.08em] text-muted sm:text-[11px] sm:tracking-[0.14em]">En attente</p><p class="mt-2 font-display text-4xl font-semibold text-amber" data-stat="en_attente">—</p></div>
      </section>

      <div class="mt-10 grid grid-cols-[minmax(0,1fr)] gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.4fr)]">
        <!-- Info -->
        <section class="card p-6 sm:p-8">
          <h2 class="text-xl font-semibold">Informations personnelles</h2>
          <p class="mt-1 text-sm">Visibles par vous seul, sauf le téléphone (membres connectés) et la wilaya.</p>
          <dl class="mt-6 divide-y divide-line border-y border-line" data-info></dl>
          <div class="mt-6 flex flex-wrap gap-2">
            <a href="/profil/modifier" class="btn btn-outline btn-sm"><i data-lucide="pencil"></i>Modifier</a>
            <button type="button" class="btn btn-ghost btn-sm text-danger hover:bg-danger-soft hover:text-danger" data-logout-btn><i data-lucide="log-out"></i>Se déconnecter</button>
          </div>
        </section>

        <!-- Annonces preview -->
        <section class="card p-6 sm:p-8">
          <div class="flex items-start justify-between gap-4">
            <div>
              <h2 class="text-xl font-semibold">Mes annonces récentes</h2>
              <p class="mt-1 text-sm">Suivez le statut de modération de chaque annonce.</p>
            </div>
            <a href="/profil/annonces" class="btn btn-ghost btn-sm shrink-0">Tout voir <i data-lucide="arrow-right"></i></a>
          </div>
          <ul class="mt-6 divide-y divide-line border-y border-line" data-recent>
            <li class="py-4"><div class="skeleton h-5 w-2/3"></div></li>
            <li class="py-4"><div class="skeleton h-5 w-1/2"></div></li>
          </ul>
          <a href="/publier" class="btn btn-primary btn-sm mt-6"><i data-lucide="plus"></i>Nouvelle annonce</a>
        </section>
      </div>
    </div>
  </main>

  <!-- @include footer -->
  <script type="module" src="/src/js/pages/profil.js"></script>
</body>
</html>
