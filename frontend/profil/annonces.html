<!doctype html>
<html lang="fr">
<head>
  <!-- @include head -->
  <title>Mes annonces — MedLink DZ</title>
  <meta name="robots" content="noindex" />
</head>
<body class="is-gated">
  <!-- @include header -->

  <main id="main" class="pb-28 pt-28 md:pt-36">
    <div class="shell" data-gate-loader><div class="skeleton h-72 rounded-3xl"></div></div>

    <div class="shell" data-gated>
      <a href="/profil" class="inline-flex items-center gap-1.5 text-sm font-medium text-body hover:text-text"><i data-lucide="arrow-left" class="size-4"></i>Mon profil</a>
      <div class="mt-6 flex flex-col justify-between gap-6 md:flex-row md:items-end">
        <div>
          <h1 class="text-4xl font-semibold md:text-5xl">Mes annonces</h1>
          <p class="mt-3">Historique complet et statut de modération de vos annonces.</p>
        </div>
        <a href="/publier" class="btn btn-primary self-start md:self-auto"><i data-lucide="plus"></i>Nouvelle annonce</a>
      </div>

      <div class="mt-10"><div class="segmented max-sm:[mask-image:linear-gradient(to_right,black_82%,transparent)]" role="group" aria-label="Filtrer par statut" data-filters>
        <button type="button" class="seg-item" data-filter="all" aria-pressed="true">Toutes <span class="seg-count" data-n="all"></span></button>
        <button type="button" class="seg-item" data-filter="publiee" aria-pressed="false">Publiées <span class="seg-count" data-n="publiee"></span></button>
        <button type="button" class="seg-item" data-filter="en_attente" aria-pressed="false">En attente <span class="seg-count" data-n="en_attente"></span></button>
        <button type="button" class="seg-item" data-filter="rejetee" aria-pressed="false">Rejetées <span class="seg-count" data-n="rejetee"></span></button>
      </div></div>

      <div class="card mt-5 overflow-hidden" data-list>
        <div class="space-y-4 p-6"><div class="skeleton h-6 w-2/3"></div><div class="skeleton h-6 w-1/2"></div><div class="skeleton h-6 w-3/5"></div></div>
      </div>
    </div>
  </main>

  <!-- @include footer -->
  <script type="module" src="/src/js/pages/profil-annonces.js"></script>
</body>
</html>
