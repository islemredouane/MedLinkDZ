<!doctype html>
<html lang="fr">
<head>
  <!-- @include head -->
  <title>Mot de passe oublié — MedLink DZ</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <main id="main" class="grid min-h-[100svh] lg:grid-cols-2">
    <section class="flex min-h-[100svh] flex-col px-6 py-6 sm:px-10">
      <div class="mx-auto my-auto w-full max-w-[400px] py-4 animate-rise">
        <!-- @include auth-logo -->
        <h1 class="text-[1.75rem] font-semibold leading-tight tracking-tight sm:text-3xl" data-title>Mot de passe oublié&nbsp;?</h1>
        <p class="mt-1.5 text-lg leading-snug text-muted" data-subtitle>Recevez un lien pour le réinitialiser.</p>
        <form class="mt-8 space-y-5" data-form>
          <div class="field">
            <label for="email" class="field-label">Email</label>
            <div class="field-control"><i data-lucide="mail"></i><input id="email" name="email" type="email" autocomplete="email" placeholder="vous@exemple.com" required></div>
          </div>
          <div class="space-y-3" data-feedback aria-live="polite"></div>
          <button class="btn btn-primary btn-lg w-full" data-submit>Envoyer le lien</button>
        </form>
        <p class="mt-6 border-t border-line pt-5 text-sm text-body">Vous vous en souvenez&nbsp;? <a href="/login" class="font-medium text-brand hover:underline">Se connecter</a></p>
      </div>
      <p class="mx-auto w-full max-w-[400px] text-center text-xs text-muted">© MedLink DZ · <a href="/conditions" class="hover:text-text">Conditions</a> · <a href="/confidentialite" class="hover:text-text">Confidentialité</a></p>
    </section>
    <!-- @include auth-aside -->
  </main>

  <script type="module" src="/src/js/pages/forgot-password.js"></script>
</body>
</html>
